<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ЧТИВО · Почти Вселенная</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oranienbaum&display=swap">
<style>
:root{--paper:#e6e7e6;--panel:#f6f6f5;--ink:#141414;--soft:#5d5d5b;--accent:#a80f03}
@media (prefers-color-scheme: dark){:root{--paper:#141414;--panel:#1d1d1c;--ink:#ecebe7;--soft:#9b9a95;--accent:#e2553f}}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:16px/1.45 "Golos Text",system-ui,sans-serif}
main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
form{width:min(380px,100%);background:var(--panel);border:1px solid var(--ink);padding:28px 24px;box-sizing:border-box}
.wm{font-weight:600;letter-spacing:.14em;font-size:13px;margin:0 0 18px}
.wm span{font-weight:400;letter-spacing:.02em;color:var(--soft)}
h1{font:400 44px/.95 Oranienbaum,Georgia,serif;margin:0 0 22px}
h1 b{font-weight:400;color:var(--accent)}
label{display:block;font-size:13px;color:var(--soft);margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:500 16px "Golos Text",system-ui,sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--ink);padding:11px 12px;outline:none}
input:focus{border-color:var(--accent)}
button{margin-top:12px;width:100%;font:600 15px "Golos Text",system-ui,sans-serif;color:var(--panel);background:var(--ink);border:1px solid var(--ink);padding:12px;cursor:pointer}
button:hover{background:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--accent)}
.rem{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;color:var(--soft)}
.rem input{width:auto;margin:0}
</style>
</head>
<body>
<main>
<form id="f" autocomplete="on">
  <p class="wm">ЧТИВО<span> · Почти Вселенная</span></p>
  <h1>по<b>ЧТИ ВО</b> вселенной</h1>
  <label for="pw">Пароль</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <label class="rem"><input type="checkbox" id="rm" checked>Запомнить на этом устройстве</label>
  <button id="go" type="submit">Войти</button>
  <p class="msg" id="msg" role="status"></p>
</form>
</main>
<script>
const SALT="8dp9teyhIt42qsVGHW2jvw==", ITER=250000;
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFrom(pw){ const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']); }
async function dec(key,buf){ const u=new Uint8Array(buf); return crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)); }
async function open_(pw,remember){
  const key=await keyFrom(pw);
  const site=await fetch('site.bin',{cache:'no-cache'}).then(r=>r.arrayBuffer());
  const html=new TextDecoder().decode(await dec(key,site));
  if(remember){ try{ localStorage.setItem('chtivo.pw',pw); }catch(_){} }
  let film='';
  try{ const fb=await fetch('film.bin',{cache:'no-cache'}).then(r=>r.arrayBuffer()); film=URL.createObjectURL(new Blob([await dec(key,fb)],{type:'video/mp4'})); }catch(_){}
  const inj='<script>window.__FILM='+JSON.stringify(film||'film-missing.mp4')+';<\/script>';
  const out=html.replace('<body>','<body>'+inj);
  document.open(); document.write(out); document.close();
}
const f=document.getElementById('f'), msg=document.getElementById('msg'), go=document.getElementById('go');
f.addEventListener('submit',async e=>{ e.preventDefault(); go.disabled=true; msg.textContent='Открываю...';
  try{ await open_(document.getElementById('pw').value, document.getElementById('rm').checked); }
  catch(_){ go.disabled=false; msg.textContent='Неверный пароль'; } });
(async()=>{ let pw=null; try{ pw=localStorage.getItem('chtivo.pw'); }catch(_){} if(pw){ msg.textContent='Открываю...'; go.disabled=true; try{ await open_(pw,true); }catch(_){ try{ localStorage.removeItem('chtivo.pw'); }catch(__){} go.disabled=false; msg.textContent=''; } } })();
</script>
</body>
</html>
